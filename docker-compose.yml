services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kiln
      POSTGRES_PASSWORD: kiln
      POSTGRES_DB: kiln
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiln -d kiln"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://kiln:kiln@db:5432/kiln
      PORT: "3000"
      HOST: 0.0.0.0
    ports:
      - "3000:3000"

volumes:
  pgdata:
