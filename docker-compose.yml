services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kiln
      POSTGRES_PASSWORD: kilnsecret
      POSTGRES_DB: kiln
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiln -d kiln"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: kiln-app:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://kiln:kilnsecret@db:5432/kiln
      PORT: "8080"
      NODE_ENV: production
    ports:
      - "8080:8080"

volumes:
  pgdata:
